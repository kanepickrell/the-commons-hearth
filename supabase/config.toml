[functions.send-rsvp-confirmation]
enabled = true
verify_jwt = true
import_map = "./functions/send-rsvp-confirmation/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-rsvp-confirmation/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-rsvp-confirmation/*.html" ]

[functions.geocode-parish]
enabled = true
verify_jwt = true
import_map = "./functions/geocode-parish/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/geocode-parish/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/geocode-parish/*.html" ]

[functions.member-notify]
enabled = true
# verify_jwt is OFF so the browser CORS preflight (OPTIONS) succeeds. Admin-only
# access is enforced inside the function by validating the caller's JWT and
# checking profiles.is_admin (see the function source).
verify_jwt = false
import_map = "./functions/member-notify/deno.json"
entrypoint = "./functions/member-notify/index.ts"

[functions.contact-notify]
enabled = true
# Public contact form: anonymous visitors must be able to call it, so JWT
# verification is OFF here. Spam is handled by the honeypot in the function.
verify_jwt = false
import_map = "./functions/contact-notify/deno.json"
entrypoint = "./functions/contact-notify/index.ts"

[functions.admin-add-member]
enabled = true
# verify_jwt is OFF so the browser CORS preflight (OPTIONS) succeeds, matching
# the other browser-facing functions. Admin-only access is enforced inside the
# function by validating the caller's JWT and checking profiles.is_admin.
verify_jwt = false
import_map = "./functions/admin-add-member/deno.json"
entrypoint = "./functions/admin-add-member/index.ts"
[functions.gathering-notify]
enabled = true
# Not called from the browser (invoked server-side with the service key), so
# gateway JWT verification stays ON.
verify_jwt = true
import_map = "./functions/gathering-notify/deno.json"
entrypoint = "./functions/gathering-notify/index.ts"

[functions.chester]
enabled = true
# Public chat guide: anonymous visitors call it, so gateway JWT verification is
# OFF. Abuse is limited inside the function (per-IP hourly + global daily caps).
verify_jwt = false
import_map = "./functions/chester/deno.json"
entrypoint = "./functions/chester/index.ts"
